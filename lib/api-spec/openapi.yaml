openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: shares
    description: Shareable generated frame images
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /shares:
    post:
      operationId: createShare
      tags: [shares]
      summary: Create a shareable generated frame
      description: Stores a flattened PNG data URL and returns a public share page path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShareInput"
      responses:
        "201":
          description: Share created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          description: Invalid image payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ShareInput:
      type: object
      properties:
        imageData:
          type: string
          description: A PNG data URL containing the flattened generated frame.
          minLength: 32
          maxLength: 14000000
      required:
        - imageData
    Share:
      type: object
      properties:
        id:
          type: string
        sharePath:
          type: string
        imagePath:
          type: string
      required:
        - id
        - sharePath
        - imagePath
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

