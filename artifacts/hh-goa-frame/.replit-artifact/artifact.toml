kind = "web"
previewPath = "/"
title = "HH Goa Frame Generator"
description = "A fast, no-login mobile-first tool that turns a user's photo into a branded Hackers House Goa 2026 profile frame, with download and share-to-X support."
version = "1.0.0"
id = "artifacts/hh-goa-frame"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18874

[services.development]
run = "pnpm --filter @workspace/hh-goa-frame run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hh-goa-frame", "run", "build" ]
serve = "static"
publicDir = "artifacts/hh-goa-frame/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18874"
BASE_PATH = "/"
